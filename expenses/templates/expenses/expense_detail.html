<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ expense.title }}</title>
</head>
<body>
    <h1>{{ expense.title }}</h1>
    <p>Owner: {{ expense.owner.username }}</p>
    <p>Amount: €{{ expense.amount }}</p>
    <p>Category: {{ expense.category }}</p>
    <p>Date: {{ expense.date }}</p>
    <form
    method="post"
    action="{% url 'expense_delete' expense.id %}">
    {% csrf_token %}
    <button type="submit">Delete expense</button>
    </form>
    <a href="{% url 'expense_list' %}">Back to expenses</a>
</body>
</html>
